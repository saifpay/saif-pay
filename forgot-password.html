<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>استعادة كلمة المرور | SAIF PAY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:linear-gradient(
135deg,
#071329,
#0d2b54,
#102f68
);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

color:white;
}

.card{
width:420px;
max-width:90%;

padding:40px;

border-radius:25px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

text-align:center;

box-shadow:
0 15px 40px rgba(0,0,0,.4);
}

.logo{
font-size:48px;
margin-bottom:15px;
}

h1{
font-size:30px;
margin-bottom:15px;
}

.description{
color:#ddd;
margin-bottom:25px;
font-size:16px;
line-height:1.8;
}

input{
width:100%;

padding:15px;

margin:10px 0;

border:none;

border-radius:12px;

font-size:16px;

outline:none;
}

input:focus{
outline:2px solid #00d8a7;
}

button{
width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:12px;

background:#00b894;

color:white;

font-size:18px;

cursor:pointer;
}

button:hover{
background:#00d8a7;
}

button:disabled{
background:#777;
cursor:not-allowed;
}

.back{
background:#455a64;
}

.back:hover{
background:#37474f;
}

.status{
margin-top:20px;

min-height:25px;

font-size:16px;

line-height:1.7;

font-weight:bold;
}

.success{
color:#2ecc71;
}

.error{
color:#ff5252;
}

.loading{
color:#ffd54f;
}

</style>

</head>

<body>


<div class="card">


<div class="logo">
🔐
</div>


<h1>
استعادة كلمة المرور
</h1>


<div class="description">

أدخل البريد الإلكتروني المرتبط بحسابك،
وسنرسل إليك رابطًا لإعادة تعيين كلمة المرور.

</div>


<input
id="email"
type="email"
placeholder="البريد الإلكتروني"
autocomplete="email"
>


<button id="resetBtn">
📧 إرسال رابط الاستعادة
</button>


<div
id="status"
class="status">
</div>


<button
class="back"
onclick="window.location.href='index.html'"
>
⬅️ العودة لتسجيل الدخول
</button>


</div>


<script type="module">

import {

auth,
sendPasswordResetEmail

} from "./firebase.js";


const emailInput =
document.getElementById("email");


const resetButton =
document.getElementById("resetBtn");


const statusElement =
document.getElementById("status");


/* ========================================
   عرض الحالة
======================================== */

function showStatus(message,type=""){

statusElement.textContent =
message;

statusElement.className =
"status " + type;

}


/* ========================================
   إرسال رابط استعادة كلمة المرور
======================================== */

async function resetPassword(){

const email =
emailInput.value.trim();


if(email === ""){

showStatus(
"❌ يرجى إدخال البريد الإلكتروني",
"error"
);

emailInput.focus();

return;

}


resetButton.disabled = true;

resetButton.textContent =
"⏳ جاري إرسال الرابط...";


showStatus(
"⏳ جاري إرسال رابط الاستعادة...",
"loading"
);


try{

await sendPasswordResetEmail(
auth,
email
);


showStatus(
"✅ تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.",
"success"
);


emailInput.value = "";


}catch(error){

console.error(
"Password Reset Error:",
error
);


if(
error.code ===
"auth/invalid-email"
){

showStatus(
"❌ البريد الإلكتروني غير صحيح.",
"error"
);

}

else if(
error.code ===
"auth/user-not-found"
){

showStatus(
"❌ لا يوجد حساب مرتبط بهذا البريد الإلكتروني.",
"error"
);

}

else{

showStatus(
"❌ حدث خطأ أثناء إرسال رابط الاستعادة.",
"error"
);

}

}


resetButton.disabled = false;

resetButton.textContent =
"📧 إرسال رابط الاستعادة";

}


/* ========================================
   زر الإرسال
======================================== */

resetButton.addEventListener(
"click",
resetPassword
);


/* ========================================
   الضغط على Enter
======================================== */

emailInput.addEventListener(
"keydown",
(event)=>{

if(event.key === "Enter"){

event.preventDefault();

resetPassword();

}

}

);

</script>


</body>

</html>
