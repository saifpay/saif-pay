<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تعديل البيانات | SAIF PAY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#0b1736;
color:white;
min-height:100vh;
padding:30px 15px;
}

.container{
width:100%;
max-width:500px;
margin:auto;
background:#16254d;
padding:25px;
border-radius:20px;
box-shadow:0 10px 35px rgba(0,0,0,.35);
}

h2{
text-align:center;
margin-bottom:25px;
font-size:27px;
color:#ffd6a5;
}

.field{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:7px;
font-size:15px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:11px;
font-size:16px;
background:white;
color:#222;
outline:none;
}

button{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:11px;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.save{
background:#2ecc71;
}

.save:hover{
background:#27ae60;
}

.back{
background:#3498db;
}

.back:hover{
background:#2980b9;
}

.message{
text-align:center;
margin-top:15px;
min-height:24px;
font-size:15px;
}

</style>

</head>

<body>

<div class="container">

<h2>✏️ تعديل البيانات</h2>

<div class="field">

<label>
👤 الاسم الكامل
</label>

<input
id="name"
type="text"
placeholder="الاسم الكامل">

</div>

<div class="field">

<label>
📅 تاريخ الميلاد
</label>

<input
id="birthDate"
type="date">

</div>

<div class="field">

<label>
👩 اسم الأم
</label>

<input
id="motherName"
type="text"
placeholder="اسم الأم">

</div>

<button
id="saveButton"
class="save">

💾 حفظ البيانات

</button>

<button
id="backButton"
class="back">

⬅ العودة

</button>

<div
id="message"
class="message">
</div>

</div>

<script type="module">

import {
auth,
db,
onAuthStateChanged,
doc,
getDoc,
updateDoc
} from "./firebase.js";


onAuthStateChanged(auth, async (user)=>{

if(!user){

window.location.href="index.html";

return;

}

try{

const userRef =
doc(db,"users",user.uid);

const userSnap =
await getDoc(userRef);

if(!userSnap.exists()){

showMessage(
"لم يتم العثور على بيانات الحساب",
true
);

return;

}

const data =
userSnap.data();

document.getElementById("name").value =
data.fullName || "";

document.getElementById("birthDate").value =
data.birthDate || "";

document.getElementById("motherName").value =
data.motherName || "";

}catch(error){

console.error(
"Load Error:",
error
);

showMessage(
"حدث خطأ أثناء تحميل البيانات",
true
);

}

});


document
.getElementById("saveButton")
.addEventListener("click",saveData);


async function saveData(){

const user =
auth.currentUser;

if(!user){

showMessage(
"يرجى تسجيل الدخول أولاً",
true
);

return;

}

const saveButton =
document.getElementById("saveButton");

saveButton.disabled = true;

saveButton.innerText =
"⏳ جاري الحفظ...";


try{

const fullName =
document
.getElementById("name")
.value
.trim();

const birthDate =
document
.getElementById("birthDate")
.value;

const motherName =
document
.getElementById("motherName")
.value
.trim();


if(!fullName){

showMessage(
"يرجى إدخال الاسم الكامل",
true
);

resetButton();

return;

}


await updateDoc(

doc(
db,
"users",
user.uid
),

{
fullName,
birthDate,
motherName
}

);


showMessage(
"تم حفظ البيانات بنجاح ✅",
false
);


setTimeout(()=>{

window.location.href =
"profile.html";

},1000);


}catch(error){

console.error(
"Save Error:",
error
);

showMessage(
"حدث خطأ أثناء حفظ البيانات",
true
);

resetButton();

}

}


document
.getElementById("backButton")
.addEventListener("click",()=>{

window.location.href =
"profile.html";

});


function showMessage(
text,
error=false
){

const message =
document.getElementById("message");

message.innerText =
text;

message.style.color =
error
? "#ff7675"
: "#2ecc71";

}


function resetButton(){

const saveButton =
document.getElementById("saveButton");

saveButton.disabled =
false;

saveButton.innerText =
"💾 حفظ البيانات";

}

</script>

</body>

</html>
