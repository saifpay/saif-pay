<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>كشف العمليات | SAIF PAY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#0b1736;
color:white;
min-height:100vh;
padding:25px 15px 40px;
}

.container{
width:100%;
max-width:900px;
margin:auto;
background:#16254d;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h2{
text-align:center;
margin-bottom:20px;
color:#2ecc71;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#2ecc71;
padding:14px;
color:white;
}

td{
background:#22386c;
padding:14px;
text-align:center;
border-bottom:1px solid #314b82;
}

.empty{
text-align:center;
padding:25px;
color:#cbd6f5;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#2ecc71;
border:none;
border-radius:10px;
font-size:18px;
color:white;
cursor:pointer;
}

button:hover{
background:#27ae60;
}

</style>

</head>

<body>

<div class="container">

<h2>📄 كشف العمليات</h2>

<table>

<thead>

<tr>
<th>التاريخ</th>
<th>العملية</th>
<th>التفاصيل</th>
<th>رقم العملية</th>
</tr>

</thead>

<tbody id="statementTable">

<tr>
<td colspan="4">
جاري تحميل العمليات...
</td>
</tr>

</tbody>

</table>

<button onclick="window.print()">
🖨️ طباعة / حفظ PDF
</button>

<button onclick="window.location.href='dashboard.html'">
🏠 العودة للرئيسية
</button>

</div>

<script type="module">

import {
auth,
db,
onAuthStateChanged,
collection,
query,
where,
getDocs
} from "./firebase.js";


onAuthStateChanged(auth, async(user)=>{

if(!user){

location.href="index.html";

return;

}

const tbody =
document.getElementById("statementTable");

try{

const transactionsQuery =
query(
collection(db,"transactions"),
where("userId","==",user.uid)
);

const snapshot =
await getDocs(transactionsQuery);


const transactions =
snapshot.docs.sort((a,b)=>{

const aTime =
a.data().createdAt?.seconds || 0;

const bTime =
b.data().createdAt?.seconds || 0;

return bTime-aTime;

});


if(transactions.length === 0){

tbody.innerHTML = `

<tr>

<td colspan="4" class="empty">

لا توجد عمليات حتى الآن.

</td>

</tr>

`;

return;

}


tbody.innerHTML = "";


transactions.forEach(transactionDoc=>{

const data =
transactionDoc.data();


let date = "-";


if(data.createdAt){

try{

date =
data.createdAt
.toDate()
.toLocaleString("ar-IQ");

}catch(error){

date = "-";

}

}


const title =
data.title ||
"عملية SAIF PAY";


const description =
data.description ||
"-";


const transactionId =
data.transactionId ||
transactionDoc.id;


const row =
document.createElement("tr");


row.innerHTML = `

<td>
${escapeHTML(date)}
</td>

<td>
${escapeHTML(title)}
</td>

<td>
${escapeHTML(description)}
</td>

<td>
${escapeHTML(transactionId)}
</td>

`;


tbody.appendChild(row);

});


}catch(error){

console.error(
"Statement Error:",
error
);

tbody.innerHTML = `

<tr>

<td colspan="4" class="empty">

❌ حدث خطأ أثناء تحميل كشف العمليات.

</td>

</tr>

`;

}

});


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>

</html>
