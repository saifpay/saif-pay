<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAIF PAY</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#0d1b2a;
color:white;
min-height:100vh;
}

.header{
background:#132238;
padding:20px;
font-size:28px;
font-weight:bold;
text-align:center;
}

.container{
width:100%;
max-width:700px;
margin:auto;
padding:25px 15px 40px;
}

.card{
background:#1b263b;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

.balance{
font-size:40px;
color:#00e676;
margin-top:10px;
font-weight:bold;
}

.transaction{
line-height:2;
font-size:16px;
}

.no-transaction{
opacity:.8;
margin-top:10px;
}

button{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:10px;
background:#00c853;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#00a844;
}
</style>

</head>

<body>

<div class="header">
SAIF PAY
</div>

<div class="container">

<div class="card">
مرحباً
<strong id="userName"></strong>
👋
</div>

<div class="card">

<div>رصيدك الحالي</div>

<div class="balance">
<span id="balance">$ 0</span>
</div>

</div>

<div class="card">

<h3>📋 آخر عملية</h3>

<div id="lastTransaction" class="transaction">
جاري تحميل آخر عملية...
</div>

</div>

<button onclick="location.href='history.html'">
📄 كشف الحساب
</button>

<button onclick="location.href='received.html'">
📥 الحوالات الواردة
</button>

<button onclick="location.href='notifications.html'">
🔔 الإشعارات
</button>

<button onclick="location.href='profile.html'">
👤 الملف الشخصي
</button>

<button onclick="location.href='settings.html'">
⚙️ الإعدادات
</button>

</div>

<script type="module">

import {
auth,
db,
onAuthStateChanged,
doc,
getDoc,
collection,
query,
where,
getDocs
} from "./firebase.js";

onAuthStateChanged(auth, async (user) => {

if(!user){

location.href="index.html";
return;

}

try{

const userRef = doc(
db,
"users",
user.uid
);

const userSnap = await getDoc(userRef);

if(!userSnap.exists()){

alert("لم يتم العثور على بيانات الحساب");
return;

}

const userData = userSnap.data();

document.getElementById("userName").textContent =
userData.fullName || "";

const balance =
Number(userData.balance || 0);

document.getElementById("balance").textContent =
"$ " + balance.toLocaleString("en-US");

const sentQuery = query(
collection(db,"transactions"),
where("userId","==",user.uid)
);

const snapshot = await getDocs(sentQuery);

const transactions = [];

snapshot.forEach((transactionDoc) => {

transactions.push({
id:transactionDoc.id,
data:transactionDoc.data()
});

});

transactions.sort((a,b) => {

const timeA =
a.data.createdAt?.seconds || 0;

const timeB =
b.data.createdAt?.seconds || 0;

return timeB - timeA;

});

if(transactions.length === 0){

document.getElementById(
"lastTransaction"
).innerHTML = `
<p class="no-transaction">
لا توجد عمليات حتى الآن.
</p>
`;

return;

}

const last = transactions[0].data;

let date = "-";

if(last.createdAt){

try{

date = last.createdAt
.toDate()
.toLocaleString("ar-IQ");

}catch(error){

date = "-";

}

}

const amount =
Number(last.amount || 0);

document.getElementById(
"lastTransaction"
).innerHTML = `

<p>
<b>📋 العملية:</b>
${last.title || last.description || "عملية مالية"}
</p>

<p>
<b>💰 المبلغ:</b>
${amount}$
</p>

<p>
<b>📅 التاريخ:</b>
${date}
</p>

<p>
<b>🆔 رقم العملية:</b>
${last.transactionId || transactions[0].id}
</p>

`;

}catch(error){

console.error(
"Dashboard Error:",
error
);

document.getElementById(
"lastTransaction"
).innerHTML = `
<p>
حدث خطأ أثناء تحميل العمليات.
</p>
`;

}

});

</script>

</body>

</html>
