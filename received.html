<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الحوالات الواردة</title>

<style>

body{
background:#0b1736;
font-family:Tahoma;
color:white;
padding:30px;
}

h1{
text-align:center;
margin-bottom:25px;
}

.card{

background:#16254d;

padding:20px;

border-radius:15px;

margin-top:15px;

box-shadow:0 0 10px rgba(0,0,0,.3);

}

.card h3{

color:#2ecc71;

margin-bottom:10px;

}

button{

width:100%;

padding:15px;

margin-top:20px;

background:#2ecc71;

border:none;

border-radius:10px;

color:white;

font-size:18px;

cursor:pointer;

}

</style>

</head>

<body>

<h1>📥 الحوالات الواردة</h1>

<div id="history"></div>

<button onclick="location.href='dashboard.html'">

🏠 العودة للرئيسية

</button>

<script type="module">

import{

auth,

db,

onAuthStateChanged,

collection,

query,

where,

getDocs

}from"./firebase.js";

onAuthStateChanged(auth,async(user)=>{

if(!user){

window.location.href="index.html";

return;

}

const container=document.getElementById("history");

container.innerHTML="";

const q=query(

collection(db,"transactions"),

where("to","==",user.uid)

);

const snapshot=await getDocs(q);

if(snapshot.empty){

container.innerHTML=`

<div class="card">

لا توجد حوالات واردة.

</div>

`;

return;

}

const list=snapshot.docs.sort((a,b)=>{

return (b.data().createdAt?.seconds||0)-(a.data().createdAt?.seconds||0);

});

list.forEach(docu=>{

const data=docu.data();

const date=data.createdAt

?data.createdAt.toDate().toLocaleString("ar-IQ")

:"-";

container.innerHTML+=`

<div class="card">

<p><b>🆔 رقم العملية:</b> ${data.transactionId || docu.id}</p>

<h3>💵 من: ${data.senderName}</h3>

<p><b>📱 هاتف المرسل:</b> ${data.senderPhone}</p>

<p><b>💰 المبلغ:</b> ${data.amount}$</p>

<p><b>📝 السبب:</b> ${data.reason}</p>

<p><b>📅 التاريخ:</b> ${date}</p>

</div>

`;

});

});

</script>

</body>

</html>
