<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء حساب جديد - SAIF PAY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#0b1736;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:white;
}

.container{
width:100%;
max-width:430px;
background:#16254d;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:15px;
margin:8px 0;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#2ecc71;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#27ae60;
}

p{
text-align:center;
margin-top:15px;
}

a{
color:#2ecc71;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>إنشاء حساب جديد</h1>

<input
type="text"
id="fullname"
placeholder="الاسم الكامل">

<input
type="text"
id="motherName"
placeholder="اسم الأم">

<input
type="date"
id="birthDate">

<input
type="text"
id="phone"
placeholder="رقم الهاتف">

<input
type="email"
id="email"
placeholder="البريد الإلكتروني">

<input
type="password"
id="password"
placeholder="كلمة المرور">

<input
type="password"
id="confirm"
placeholder="تأكيد كلمة المرور">

<button onclick="register()">
إنشاء الحساب
</button>

<p>

لديك حساب؟

<a href="index.html">
تسجيل الدخول
</a>

</p>

</div>

<script type="module">

import {
auth,
db,
createUserWithEmailAndPassword,
doc,
setDoc
} from "./firebase.js";


async function register(){

const fullname =
document.getElementById("fullname").value.trim();

const motherName =
document.getElementById("motherName").value.trim();

const birthDate =
document.getElementById("birthDate").value;

const phone =
document.getElementById("phone").value.trim();

const email =
document.getElementById("email").value.trim().toLowerCase();

const password =
document.getElementById("password").value;

const confirm =
document.getElementById("confirm").value;


if(
!fullname ||
!motherName ||
!birthDate ||
!phone ||
!email ||
!password ||
!confirm
){

alert("يرجى ملء جميع الحقول");

return;

}


if(password !== confirm){

alert("كلمتا المرور غير متطابقتين");

return;

}


if(phone.length < 11){

alert("رقم الهاتف غير صحيح");

return;

}


try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const uid =
userCredential.user.uid;


const accountNumber =
"100" +
Math.floor(
10000000 + Math.random() * 90000000
);


const customerID =
"CUST" +
Math.floor(
100000 + Math.random() * 900000
);


await setDoc(
doc(db,"users",uid),
{

uid: uid,

fullName: fullname,

motherName: motherName,

birthDate: birthDate,

phone: phone,

email: email,

accountNumber: accountNumber,

customerID: customerID,

status: "active",

createdAt: new Date()

}
);


alert("تم إنشاء الحساب بنجاح");

window.location.href = "index.html";


}catch(error){

console.error("Registration Error:",error);

alert("تعذر إنشاء الحساب. يرجى المحاولة مرة أخرى.");

}

}


window.register = register;

</script>

</body>

</html>
