<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SAIF PAY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#071329,#0d2b54,#102f68);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.card{
width:420px;
padding:40px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.logo{
font-size:48px;
margin-bottom:15px;
}

h1{
font-size:40px;
margin-bottom:10px;
}

p{
color:#ddd;
margin-bottom:30px;
font-size:18px;
}

input{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:12px;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:#00b894;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#00d8a7;
}

a{
color:#00d8a7;
text-decoration:none;
font-weight:bold;
}

.footer{
margin-top:25px;
font-size:13px;
color:#bbb;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">💳</div>

<h1>SAIF PAY</h1>

<p>تسجيل الدخول</p>

<input
id="username"
type="email"
placeholder="البريد الإلكتروني">

<input
id="password"
type="password"
placeholder="كلمة المرور">

<button onclick="login()">
تسجيل الدخول
</button>
<p style="margin-top:15px;">
<a href="forgot-password.html">🔑 نسيت كلمة المرور؟</a>
</p>
<p style="margin-top:20px;">
ليس لديك حساب؟
<a href="register.html">إنشاء حساب جديد</a>
</p>

<div class="footer">
©️ 2026 SAIF PAY
</div>

</div>

<script type="module">

import {
auth,
signInWithEmailAndPassword
} from "./firebase.js";

window.login = async function(){

const email=document.getElementById("username").value.trim();

const password=document.getElementById("password").value;

if(email==""){

alert("يرجى إدخال البريد الإلكتروني");

return;

}

if(password==""){

alert("يرجى إدخال كلمة المرور");

return;

}
try{

await signInWithEmailAndPassword(auth,email,password);

alert("تم تسجيل الدخول بنجاح");

window.location.href="dashboard.html";

}

catch(error){

alert("فشل تسجيل الدخول");

console.log(error);

}

}

</script>

</body>

</html>
