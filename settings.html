<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الإعدادات | SAIF PAY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma;
}

body{
background:#0d1b2a;
color:white;
min-height:100vh;
}

.container{
width:90%;
max-width:650px;
margin:30px auto;
}

.header{
background:#132238;
padding:20px;
border-radius:15px;
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

.card{
background:#1b263b;
padding:25px;
border-radius:15px;
margin-bottom:20px;
}

.card h3{
margin-bottom:20px;
color:#00e676;
}

label{
display:block;
margin-top:15px;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-size:16px;
background:#263850;
color:white;
outline:none;
}

input:focus{
border:2px solid #00e676;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#00c853;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#00a844;
}

.logout{
background:#e53935;
}

.logout:hover{
background:#c62828;
}

.back{
background:#455a64;
}

.back:hover{
background:#37474f;
}

.status{
text-align:center;
margin-top:15px;
font-size:16px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
⚙️ الإعدادات
</div>


<!-- تغيير كلمة المرور -->

<div class="card">

<h3>🔐 تغيير كلمة المرور</h3>

<label>كلمة المرور الحالية</label>

<input
type="password"
id="currentPassword"
placeholder="أدخل كلمة المرور الحالية"
>

<label>كلمة المرور الجديدة</label>

<input
type="password"
id="newPassword"
placeholder="أدخل كلمة المرور الجديدة"
>

<label>تأكيد كلمة المرور الجديدة</label>

<input
type="password"
id="confirmPassword"
placeholder="أعد إدخال كلمة المرور الجديدة"
>

<button id="changePasswordBtn">
🔐 تغيير كلمة المرور
</button>

<div id="passwordStatus" class="status"></div>

</div>


<!-- الإشعارات -->

<div class="card">

<h3>🔔 الإشعارات</h3>

<button id="notificationsBtn">
🔔 تفعيل الإشعارات
</button>

<div id="notificationStatus" class="status">
الإشعارات مفعلة
</div>

</div>


<!-- تسجيل الخروج -->

<div class="card">

<h3>🚪 الحساب</h3>

<button id="logoutBtn" class="logout">
🚪 تسجيل الخروج
</button>

<button
onclick="window.location.href='dashboard.html'"
class="back"
>
⬅️ العودة للرئيسية
</button>

</div>

</div>


<script type="module">

import {
auth,
db,
onAuthStateChanged,
updatePassword,
reauthenticateWithCredential,
EmailAuthProvider,
signOut,
doc,
getDoc,
updateDoc
} from "./firebase.js";


/* =========================
   التحقق من تسجيل الدخول
========================= */

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="index.html";

return;

}

try{

const userRef = doc(db,"users",user.uid);

const userSnap = await getDoc(userRef);

if(userSnap.exists()){

const data = userSnap.data();

if(data.notificationsEnabled === false){

document.getElementById("notificationsBtn").textContent =
"🔔 تفعيل الإشعارات";

document.getElementById("notificationStatus").textContent =
"الإشعارات متوقفة";

}else{

document.getElementById("notificationsBtn").textContent =
"🔕 إيقاف الإشعارات";

document.getElementById("notificationStatus").textContent =
"الإشعارات مفعلة";

}

}

}catch(error){

console.error(error);

}

});


/* =========================
   تغيير كلمة المرور
========================= */

document
.getElementById("changePasswordBtn")
.addEventListener("click", async()=>{

const currentPassword =
document.getElementById("currentPassword").value.trim();

const newPassword =
document.getElementById("newPassword").value.trim();

const confirmPassword =
document.getElementById("confirmPassword").value.trim();

const status =
document.getElementById("passwordStatus");


status.textContent="";


if(currentPassword===""){

status.textContent="❌ أدخل كلمة المرور الحالية";

return;

}


if(newPassword===""){

status.textContent="❌ أدخل كلمة المرور الجديدة";

return;

}


if(newPassword.length < 6){

status.textContent=
"❌ كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل";

return;

}


if(newPassword !== confirmPassword){

status.textContent=
"❌ تأكيد كلمة المرور غير مطابق";

return;

}


if(currentPassword === newPassword){

status.textContent=
"❌ كلمة المرور الجديدة يجب أن تكون مختلفة عن القديمة";

return;

}


const user = auth.currentUser;


if(!user){

window.location.href="index.html";

return;

}


try{

status.textContent="⏳ جارٍ تغيير كلمة المرور...";


const credential =
EmailAuthProvider.credential(
user.email,
currentPassword
);


await reauthenticateWithCredential(
user,
credential
);


await updatePassword(
user,
newPassword
);


status.textContent=
"✅ تم تغيير كلمة المرور بنجاح";


document.getElementById("currentPassword").value="";
document.getElementById("newPassword").value="";
document.getElementById("confirmPassword").value="";


}catch(error){

console.error(error);


if(error.code === "auth/invalid-credential" ||
error.code === "auth/wrong-password"){

status.textContent=
"❌ كلمة المرور الحالية غير صحيحة";

}else{

status.textContent=
"❌ حدث خطأ أثناء تغيير كلمة المرور";

}

}

});


/* =========================
   الإشعارات
========================= */

document
.getElementById("notificationsBtn")
.addEventListener("click", async()=>{

const user = auth.currentUser;

if(!user){

return;

}

const button =
document.getElementById("notificationsBtn");

const status =
document.getElementById("notificationStatus");


try{

const userRef =
doc(db,"users",user.uid);

const userSnap =
await getDoc(userRef);

let enabled = true;


if(userSnap.exists()){

const data = userSnap.data();

enabled =
data.notificationsEnabled !== false;

}


enabled = !enabled;


await updateDoc(userRef,{

notificationsEnabled:enabled

});


if(enabled){

button.textContent =
"🔕 إيقاف الإشعارات";

status.textContent =
"الإشعارات مفعلة";

}else{

button.textContent =
"🔔 تفعيل الإشعارات";

status.textContent =
"الإشعارات متوقفة";

}


}catch(error){

console.error(error);

status.textContent =
"❌ تعذر تحديث إعداد الإشعارات";

}

});


/* =========================
   تسجيل الخروج
========================= */

document
.getElementById("logoutBtn")
.addEventListener("click", async()=>{

const confirmLogout =
confirm("هل تريد تسجيل الخروج من SAIF PAY؟");


if(!confirmLogout){

return;

}


try{

await signOut(auth);

window.location.href="index.html";

}catch(error){

console.error(error);

alert("حدث خطأ أثناء تسجيل الخروج");

}

});

</script>

</body>

</html>
