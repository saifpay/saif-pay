<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الإعدادات | SAIF PAY</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#0d1b2a;
color:white;
min-height:100vh;
padding:25px 15px 40px;
}

.container{
width:100%;
max-width:500px;
margin:auto;
}

.header{
background:#132238;
padding:20px;
border-radius:16px;
text-align:center;
font-size:26px;
font-weight:bold;
margin-bottom:20px;
}

.card{
background:#1b263b;
padding:20px;
border-radius:16px;
}

button{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:10px;
background:#00c853;
color:white;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#00a844;
}

.secondary{
background:#455a64;
}

.secondary:hover{
background:#37474f;
}

.logout{
background:#c62828;
}

.logout:hover{
background:#b71c1c;
}
</style>

</head>

<body>

<div class="container">

<div class="header">
⚙️ الإعدادات
</div>

<div class="card">

<button onclick="location.href='change-password.html'">
🔐 تغيير كلمة المرور
</button>

<button
class="secondary"
onclick="location.href='profile.html'"
>
👤 الملف الشخصي
</button>

<button
class="secondary"
onclick="location.href='dashboard.html'"
>
🏠 العودة للرئيسية
</button>

<button
id="logoutBtn"
class="logout"
>
🚪 تسجيل الخروج
</button>

</div>

</div>

<script type="module">

import {
auth,
signOut
} from "./firebase.js";

const logoutButton =
document.getElementById("logoutBtn");

logoutButton.addEventListener("click", async()=>{

try{

await signOut(auth);

window.location.href="index.html";

}catch(error){

console.error("Logout Error:",error);

alert("❌ حدث خطأ أثناء تسجيل الخروج.");

}

});

</script>

</body>

</html>
