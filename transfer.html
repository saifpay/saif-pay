<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحويل الأموال | SAIF PAY</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#0d2b54;
    color:white;
    min-height:100vh;
}

.container{
    width:420px;
    max-width:92%;
    margin:40px auto;
    background:#1b3d6d;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.balance{
    background:#16345f;
    padding:15px;
    border-radius:12px;
    text-align:center;
    margin-bottom:20px;
}

.balance-title{
    font-size:18px;
}

.balance-amount{
    font-size:32px;
    color:#2ecc71;
    font-weight:bold;
    margin-top:10px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:15px;
    margin:5px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:white;
    color:#222;
}

input[readonly]{
    background:#dfe8f2;
    color:#333;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#22d67a;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1fbf6d;
}

button:disabled{
    background:#777;
    cursor:not-allowed;
}

.back{
    background:#455a64;
}

.back:hover{
    background:#37474f;
}

.status{
    text-align:center;
    margin-top:15px;
    min-height:24px;
    font-size:16px;
    font-weight:bold;
}

.success{
    color:#2ecc71;
}

.error{
    color:#ff5252;
}

.loading{
    color:#ffd54f;
}

</style>

</head>

<body>

<div class="container">

<h1>💸 تحويل الأموال</h1>


<!-- الرصيد -->

<div class="balance">

    <div class="balance-title">
        الرصيد الحالي
    </div>

    <div
        id="balance"
        class="balance-amount"
    >
        $ 0.00
    </div>

</div>


<!-- المستلم -->

<label>
    📱 رقم هاتف المستلم
</label>

<input
    id="phone"
    type="text"
    placeholder="077xxxxxxxx"
    autocomplete="off"
>


<label>
    👤 اسم المستلم
</label>

<input
    id="receiver"
    type="text"
    readonly
    placeholder="سيظهر الاسم تلقائياً"
>


<!-- المبلغ -->

<label>
    💰 المبلغ
</label>

<input
    id="amount"
    type="number"
    min="0.01"
    step="0.01"
    placeholder="أدخل المبلغ"
>


<!-- السبب -->

<label>
    📝 سبب التحويل
</label>

<input
    id="reason"
    type="text"
    placeholder="مثال: تحويل شخصي"
>


<!-- الرقم السري -->

<label>
    🔐 الرقم السري
</label>

<input
    id="pin"
    type="password"
    placeholder="أدخل الرقم السري"
    autocomplete="off"
>


<button id="sendMoneyBtn">
    💸 إرسال الأموال
</button>


<div
    id="status"
    class="status">
</div>


<button
    id="backBtn"
    class="back"
>
    🏠 العودة للرئيسية
</button>

</div>


<script type="module">

import {

    auth,
    db,
    onAuthStateChanged,
    doc,
    getDoc

} from "./firebase.js";


/* ========================================
   عناصر الصفحة
======================================== */

const balanceElement =
    document.getElementById("balance");

const phoneElement =
    document.getElementById("phone");

const receiverElement =
    document.getElementById("receiver");

const amountElement =
    document.getElementById("amount");

const reasonElement =
    document.getElementById("reason");

const pinElement =
    document.getElementById("pin");

const sendButton =
    document.getElementById("sendMoneyBtn");

const backButton =
    document.getElementById("backBtn");

const statusElement =
    document.getElementById("status");


/* ========================================
   المستخدم الحالي
======================================== */

let currentUser = null;

let receiverUid = null;

let transferInProgress = false;


/*
   معرف العملية الحالي

   يبقى نفسه أثناء محاولة التحويل
   حتى لا يتكرر التحويل إذا انقطع الاتصال
*/

let currentRequestId = null;


/* ========================================
   الحالة
======================================== */

function showStatus(
    message,
    type = ""
){

    statusElement.textContent =
        message;

    statusElement.className =
        "status " + type;

}


/* ========================================
   عرض الرصيد
======================================== */

function displayBalance(
    balance
){

    const value =
        Number(balance || 0);

    balanceElement.textContent =
        "$ " +
        value.toLocaleString(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* ========================================
   التحقق من تسجيل الدخول
======================================== */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        currentUser =
            user;


        try{

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(!userSnap.exists()){

                showStatus(
                    "❌ تعذر العثور على بيانات الحساب",
                    "error"
                );

                return;

            }


            const userData =
                userSnap.data();


            displayBalance(
                userData.balance
            );


        }catch(error){

            console.error(
                error
            );


            showStatus(
                "❌ حدث خطأ أثناء تحميل الحساب",
                "error"
            );

        }

    }
);


/* ========================================
   البحث عن المستلم
======================================== */

async function findUser(){

    const phone =
        phoneElement.value.trim();


    /*
    ----------------------------------------
       تنظيف بيانات المستلم القديم
    ----------------------------------------
    */

    receiverElement.value =
        "";

    receiverUid =
        null;


    /*
    ----------------------------------------
       تغيير المستلم يعني عملية جديدة
    ----------------------------------------
    */

    currentRequestId =
        null;


    /*
    ----------------------------------------
       التحقق من الهاتف
    ----------------------------------------
    */

    if(phone === ""){

        return;

    }


    /*
    ----------------------------------------
       التأكد من تسجيل الدخول
    ----------------------------------------
    */

    if(!currentUser){

        showStatus(
            "❌ يجب تسجيل الدخول أولاً",
            "error"
        );

        return;

    }


    showStatus(
        "⏳ جاري البحث عن المستلم...",
        "loading"
    );


    try{

        /*
        ====================================
           الحصول على Firebase ID Token
        ====================================
        */

        const token =
            await currentUser.getIdToken();


        /*
        ====================================
           البحث عن المستخدم عبر SERVER
        ====================================
        */

        const response =
            await fetch(
                "/api/user/by-phone?phone=" +
                encodeURIComponent(phone),
                {

                    method:
                        "GET",

                    headers:{

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );


        /*
        ====================================
           قراءة نتيجة SERVER
        ====================================
        */

        const result =
            await response.json();


        /*
        ====================================
           التحقق من النتيجة
        ====================================
        */

        if(
            !response.ok ||
            !result.success
        ){

            throw new Error(
                result.message ||
                "لم يتم العثور على المستخدم"
            );

        }


        /*
        ====================================
           بيانات المستلم
        ====================================
        */

        receiverUid =
            result.user.uid;


        receiverElement.value =
            result.user.fullName ||
            "مستخدم SAIF PAY";


        showStatus(
            "✅ تم العثور على المستلم",
            "success"
        );


    }catch(error){

        console.error(
            "Find User Error:",
            error
        );


        receiverElement.value =
            "";

        receiverUid =
            null;


        showStatus(
            "❌ " +
            error.message,
            "error"
        );

    }

}


/* ========================================
   البحث عند مغادرة الهاتف
======================================== */

phoneElement.addEventListener(
    "blur",
    findUser
);


/* ========================================
   البحث عند Enter
======================================== */

phoneElement.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            findUser();

        }

    }
);


/* ========================================
   إنشاء Request ID
======================================== */

function createRequestId(){

    /*
    ----------------------------------------
       الطريقة الأساسية
    ----------------------------------------
    */

    if(
        typeof crypto !== "undefined" &&
        typeof crypto.randomUUID === "function"
    ){

        return crypto.randomUUID();

    }


    /*
    ----------------------------------------
       طريقة احتياطية
    ----------------------------------------
    */

    return (
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2,12)
    );

}


/* ========================================
   تنفيذ التحويل عبر SERVER
======================================== */

async function sendMoney(){

    /*
    ----------------------------------------
       منع الضغط المتكرر
    ----------------------------------------
    */

    if(
        transferInProgress
    ){

        return;

    }


    /*
    ----------------------------------------
       التأكد من تسجيل الدخول
    ----------------------------------------
    */

    if(!currentUser){

        showStatus(
            "❌ يجب تسجيل الدخول أولاً",
            "error"
        );

        return;

    }


    /*
    ----------------------------------------
       التأكد من وجود المستلم
    ----------------------------------------
    */

    if(!receiverUid){

        await findUser();


        if(!receiverUid){

            return;

        }

    }


    /*
    ----------------------------------------
       قراءة البيانات
    ----------------------------------------
    */

    const amount =
        Number(
            amountElement.value
        );


    const reason =
        reasonElement.value.trim();


    const pin =
        pinElement.value.trim();


    /*
    ----------------------------------------
       التحقق من المبلغ
    ----------------------------------------
    */

    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showStatus(
            "❌ يرجى إدخال مبلغ صحيح",
            "error"
        );


        amountElement.focus();


        return;

    }


    /*
    ----------------------------------------
       التحقق من السبب
    ----------------------------------------
    */

    if(
        reason === ""
    ){

        showStatus(
            "❌ يرجى إدخال سبب التحويل",
            "error"
        );


        reasonElement.focus();


        return;

    }


    /*
    ----------------------------------------
       التحقق من الرقم السري
    ----------------------------------------
    */

    if(
        pin === ""
    ){

        showStatus(
            "❌ يرجى إدخال الرقم السري",
            "error"
        );


        pinElement.focus();


        return;

    }


    /*
    ========================================
       إنشاء Request ID مرة واحدة فقط
    ========================================
    */

    if(
        !currentRequestId
    ){

        currentRequestId =
            createRequestId();

    }


    /*
    ----------------------------------------
       بدء التحويل
    ----------------------------------------
    */

    transferInProgress =
        true;


    sendButton.disabled =
        true;


    sendButton.textContent =
        "⏳ جاري تنفيذ التحويل...";


    showStatus(
        "⏳ جاري تنفيذ التحويل...",
        "loading"
    );


    try{

        /*
        ====================================
           الحصول على Firebase ID Token
        ====================================
        */

        const token =
            await currentUser.getIdToken(
                true
            );


        /*
        ====================================
           إرسال الطلب إلى SERVER
        ====================================
        */

        const response =
            await fetch(
                "/api/transfer",
                {

                    method:
                        "POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token

                    },


                    body:
                        JSON.stringify({

                            receiverUid:
                                receiverUid,

                            amount:
                                amount,

                            reason:
                                reason,

                            pin:
                                pin,

                            requestId:
                                currentRequestId

                        })

                }
            );


        /*
        ====================================
           قراءة رد SERVER بشكل آمن
        ====================================
        */

        const responseText =
            await response.text();


        let result =
            null;


        /*
        ------------------------------------
           محاولة تحويل الرد إلى JSON
        ------------------------------------
        */

        if(
            responseText.trim() !== ""
        ){

            try{

                result =
                    JSON.parse(
                        responseText
                    );

            }catch(parseError){

                console.error(
                    "Invalid JSON response:",
                    responseText
                );


                throw new Error(
                    "السيرفر أرسل ردًا غير صالح"
                );

            }

        }


        /*
        ====================================
           إذا كان الرد فارغًا
        ====================================
        */

        if(!result){

            console.error(
                "Empty server response."
            );


            console.error(
                "HTTP status:",
                response.status
            );


            throw new Error(
                "السيرفر لم يُرجع نتيجة للتحويل"
            );

        }


        /*
        ====================================
           فشل التحويل
        ====================================
        */

        if(
            !response.ok ||
            !result.success
        ){

            throw new Error(
                result.message ||
                "فشل تنفيذ التحويل"
            );

        }


        /*
        ====================================
           نجاح التحويل
        ====================================
        */

        displayBalance(
            result.balance
        );


        showStatus(
            "✅ تم التحويل بنجاح",
            "success"
        );


        /*
        ====================================
           عرض رقم العملية
        ====================================
        */

        alert(
            "✅ تم التحويل بنجاح\n\n" +
            "رقم العملية:\n" +
            result.transactionId
        );


        /*
        ====================================
           الانتقال إلى Dashboard
        ====================================
        */

        window.location.href =
            "dashboard.html";


    }catch(error){

        console.error(
            "Transfer Error:",
            error
        );


        showStatus(
            "❌ " +
            error.message,
            "error"
        );


        /*
        ------------------------------------
           السماح بإعادة المحاولة
        ------------------------------------
        */

        transferInProgress =
            false;


        sendButton.disabled =
            false;


        sendButton.textContent =
            "💸 إرسال الأموال";

        /*
        مهم:
        لا نضع currentRequestId = null هنا.

        إذا كان التحويل وصل للسيرفر ونفذ،
        ثم انقطع الرد، ستستخدم المحاولة التالية
        نفس Request ID ويمنع السيرفر تكرار العملية.
        */

    }

}


/* ========================================
   زر التحويل
======================================== */

sendButton.addEventListener(
    "click",
    sendMoney
);


/* ========================================
   العودة
======================================== */

backButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "dashboard.html";

    }
);

</script>

</body>

</html>
