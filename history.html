<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سجل العمليات | SAIF PAY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#0b1736;
color:white;
min-height:100vh;
padding:25px 15px 40px;
}

.container{
width:100%;
max-width:750px;
margin:auto;
}

h1{
text-align:center;
font-size:30px;
margin:15px 0 10px;
}

.subtitle{
text-align:center;
color:#b9c7e6;
margin-bottom:25px;
font-size:15px;
}

.card{
background:#16254d;
padding:20px;
border-radius:18px;
margin-top:16px;
box-shadow:0 5px 20px rgba(0,0,0,.25);
border-right:5px solid #2ecc71;
}

.card h3{
margin-bottom:12px;
}

.card p{
margin:9px 0;
line-height:1.7;
color:#e8edff;
}

.card p b{
color:white;
}

.date{
color:#b9c7e6;
font-size:14px;
margin-top:12px;
}

.transaction-id{
background:#0d1b3d;
padding:10px;
border-radius:8px;
margin-top:15px;
word-break:break-all;
font-size:13px;
color:#cbd6f5;
}

.empty,
.loading{
background:#16254d;
padding:30px 20px;
border-radius:18px;
text-align:center;
color:#cbd6f5;
margin-top:20px;
}

button{
width:100%;
padding:16px;
margin-top:25px;
background:#2ecc71;
border:none;
border-radius:12px;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#27ae60;
}

</style>

</head>

<body>

<div class="container">

<h1>📄 سجل العمليات</h1>

<div class="subtitle">
جميع عمليات SAIF PAY الخاصة بحسابك
</div>

<div id="history">

<div class="loading">
⏳ جاري تحميل العمليات...
</div>

</div>

<button onclick="location.href='dashboard.html'">
🏠 العودة للرئيسية
</button>

</div>

<script type="module">

import {
auth,
db,
onAuthStateChanged,
collection,
query,
where,
getDocs
} from "./firebase.js";


onAuthStateChanged(auth, async (user)=>{

if(!user){

window.location.href="index.html";

return;

}

const container =
document.getElementById("history");

try{

const transactionsQuery =
query(
collection(db,"transactions"),
where("userId","==",user.uid)
);

const snapshot =
await getDocs(transactionsQuery);

const transactions = [];

snapshot.forEach((transactionDoc)=>{

transactions.push({

id:transactionDoc.id,

data:transactionDoc.data()

});

});


transactions.sort((a,b)=>{

const timeA =
a.data.createdAt?.seconds || 0;

const timeB =
b.data.createdAt?.seconds || 0;

return timeB - timeA;

});


if(transactions.length === 0){

container.innerHTML = `

<div class="empty">

<div style="font-size:40px;">
📭
</div>

<br>

لا توجد عمليات حتى الآن.

</div>

`;

return;

}


container.innerHTML = "";


transactions.forEach(transaction=>{

const data =
transaction.data;

let date = "-";


if(data.createdAt){

try{

date =
data.createdAt
.toDate()
.toLocaleString("ar-IQ");

}catch(error){

date = "-";

}

}


const title =
data.title ||
"عملية SAIF PAY";


const description =
data.description ||
"لا يوجد وصف";


const transactionId =
data.transactionId ||
transaction.id;


const card =
document.createElement("div");

card.className =
"card";


card.innerHTML = `

<h3>
📋 ${escapeHTML(title)}
</h3>

<p>
<b>📝 التفاصيل:</b>
${escapeHTML(description)}
</p>

<div class="date">
📅 ${escapeHTML(date)}
</div>

<div class="transaction-id">

<b>🆔 رقم العملية:</b><br>

${escapeHTML(transactionId)}

</div>

`;


container.appendChild(card);

});


}catch(error){

console.error(
"History Error:",
error
);

container.innerHTML = `

<div class="empty">

❌ حدث خطأ أثناء تحميل سجل العمليات.

<br><br>

حاول تحديث الصفحة.

</div>

`;

}

});


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>

</html>
