<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الإشعارات | SAIF PAY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#0b1736;
color:white;
min-height:100vh;
padding:30px 15px 40px;
}

.container{
width:100%;
max-width:700px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:25px;
font-size:30px;
}

.card{
background:#16254d;
padding:20px;
border-radius:15px;
margin-top:15px;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

.card h3{
margin-bottom:12px;
}

.card p{
line-height:1.8;
margin-top:8px;
}

.date{
color:#b9c7e6;
font-size:14px;
}

.empty,
.error{
text-align:center;
color:#cbd6f5;
}

.error{
color:#ff7675;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#2ecc71;
border:none;
border-radius:10px;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#27ae60;
}

</style>

</head>

<body>

<div class="container">

<h1>🔔 الإشعارات</h1>

<div id="notifications">

<div class="card empty">
⏳ جاري تحميل الإشعارات...
</div>

</div>

<button onclick="location.href='dashboard.html'">
🏠 العودة للرئيسية
</button>

</div>

<script type="module">

import {
auth,
db,
onAuthStateChanged,
collection,
query,
where,
getDocs
} from "./firebase.js";


onAuthStateChanged(auth, async(user)=>{

if(!user){

location.href="index.html";
return;

}

const container =
document.getElementById("notifications");

try{

const notificationsQuery =
query(
collection(db,"notifications"),
where("userId","==",user.uid)
);

const snapshot =
await getDocs(notificationsQuery);


if(snapshot.empty){

container.innerHTML = `

<div class="card empty">
📭 لا توجد إشعارات حالياً.
</div>

`;

return;

}


const notifications =
snapshot.docs.sort((a,b)=>{

const aTime =
a.data().createdAt?.seconds || 0;

const bTime =
b.data().createdAt?.seconds || 0;

return bTime-aTime;

});


container.innerHTML = "";


notifications.forEach(notificationDoc=>{

const data =
notificationDoc.data();


let date = "-";


if(data.createdAt){

try{

date =
data.createdAt
.toDate()
.toLocaleString("ar-IQ");

}catch(error){

date = "-";

}

}


const card =
document.createElement("div");

card.className =
"card";


card.innerHTML = `

<h3>
🔔 ${escapeHTML(
data.title || "إشعار"
)}
</h3>

<p>
${escapeHTML(
data.message || ""
)}
</p>

<p class="date">
📅 ${escapeHTML(date)}
</p>

`;


container.appendChild(card);

});


}catch(error){

console.error(
"Notifications Error:",
error
);

container.innerHTML = `

<div class="card error">
❌ حدث خطأ أثناء تحميل الإشعارات.
</div>

`;

}

});


function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>

</html>
