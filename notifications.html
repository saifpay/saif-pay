<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الإشعارات</title>

<style>

body{
background:#0b1736;
font-family:Tahoma;
color:white;
padding:30px;
}

h1{
text-align:center;
margin-bottom:25px;
}

.card{
background:#16254d;
padding:20px;
border-radius:15px;
margin-top:15px;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#2ecc71;
border:none;
border-radius:10px;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>🔔 الإشعارات</h1>

<div id="notifications"></div>

<button onclick="location.href='dashboard.html'">
🏠 العودة للرئيسية
</button>
<script type="module">

import {
auth,
db,
onAuthStateChanged,
collection,
query,
where,
getDocs
} from "./firebase.js";

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="index.html";
return;
}

const container=document.getElementById("notifications");
container.innerHTML="";

const q=query(
collection(db,"notifications"),
where("userId","==",user.uid)
);

const snapshot=await getDocs(q);

if(snapshot.empty){

container.innerHTML=`
<div class="card">
<p>لا توجد إشعارات حالياً.</p>
</div>
`;

return;

}

const notifications=snapshot.docs.sort((a,b)=>{

const aTime=a.data().createdAt?.seconds||0;
const bTime=b.data().createdAt?.seconds||0;

return bTime-aTime;

});

notifications.forEach(docu=>{

const data=docu.data();

const date=data.createdAt
? data.createdAt.toDate().toLocaleString("ar-IQ")
: "-";

container.innerHTML+=`

<div class="card">

<h3>🔔 ${data.title}</h3>

<p>${data.message}</p>

<p><b>📅 ${date}</b></p>

</div>

`;

});

});

</script>
</body>
</html>
