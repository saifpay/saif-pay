<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الملف الشخصي | SAIF PAY</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
background:#0b1736;
color:white;
min-height:100vh;
padding:30px 15px;
}

.container{
width:100%;
max-width:500px;
margin:auto;
background:#16254d;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.header{
text-align:center;
font-size:26px;
font-weight:bold;
margin-bottom:25px;
}

.info{
background:#22386c;
padding:15px;
border-radius:12px;
margin-top:10px;
line-height:1.7;
word-break:break-word;
}

.info b{
color:#2ecc71;
}

.status{
color:#2ecc71;
font-weight:bold;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#2ecc71;
color:white;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#27ae60;
}

.loading{
text-align:center;
color:#ffd6a5;
}

.error{
text-align:center;
color:#ff7675;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
👤 الملف الشخصي
</div>

<h2 id="userName" class="loading">
جاري تحميل البيانات...
</h2>

<div class="info">
<b>رقم الحساب:</b>
<span id="accountNumber">-</span>
</div>

<div class="info">
<b>رقم العميل:</b>
<span id="customerID">-</span>
</div>

<div class="info">
<b>حالة الحساب:</b>
<span class="status">نشط ✅</span>
</div>

<div class="info">
<b>رقم الهاتف:</b>
<span id="userPhone">-</span>
</div>

<div class="info">
<b>البريد الإلكتروني:</b>
<span id="userEmail">-</span>
</div>

<div class="info">
<b>تاريخ الميلاد:</b>
<span id="birthDate">-</span>
</div>

<div class="info">
<b>اسم الأم:</b>
<span id="motherName">-</span>
</div>

<button onclick="location.href='edit-profile.html'">
✏️ تعديل البيانات
</button>

<button onclick="location.href='dashboard.html'">
🏠 العودة للرئيسية
</button>

</div>

<script type="module">

import {
auth,
db,
onAuthStateChanged,
doc,
getDoc
} from "./firebase.js";

onAuthStateChanged(auth, async (user) => {

if(!user){

location.href="index.html";
return;

}

try{

const userRef =
doc(db,"users",user.uid);

const userSnap =
await getDoc(userRef);

if(!userSnap.exists()){

document.getElementById("userName").textContent =
"لم يتم العثور على بيانات الحساب";

document.getElementById("userName").className =
"error";

return;

}

const data =
userSnap.data();

document.getElementById("userName").textContent =
data.fullName || "-";

document.getElementById("accountNumber").textContent =
data.accountNumber || "-";

document.getElementById("customerID").textContent =
data.customerID || "-";

document.getElementById("userPhone").textContent =
data.phone || "-";

document.getElementById("userEmail").textContent =
data.email || user.email || "-";

document.getElementById("birthDate").textContent =
data.birthDate || "-";

document.getElementById("motherName").textContent =
data.motherName || "-";

document.getElementById("userName").className = "";

}catch(error){

console.error("Profile Error:",error);

document.getElementById("userName").textContent =
"حدث خطأ أثناء تحميل البيانات";

document.getElementById("userName").className =
"error";

}

});

</script>

</body>

</html>
